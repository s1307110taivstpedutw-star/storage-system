<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倉儲管理系統 - 登入</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f9; margin: 0; }
    .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .input-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #0056b3; }
    #msg { margin-top: 15px; color: red; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>倉儲管理系統登入</h2>
    <form id="loginForm">
      <div class="input-group">
        <label>帳號</label>
        <input type="text" id="username" required>
      </div>
      <div class="input-group">
        <label>密碼</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit">登入</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      const msgDiv = document.getElementById('msg');

      if (data.success) {
        msgDiv.style.color = 'green';
        msgDiv.innerText = '登入成功！歡迎進入系統。';
      } else {
        msgDiv.style.color = 'red';
        msgDiv.innerText = data.message;
      }
    });
  </script>
</body>
</html>
