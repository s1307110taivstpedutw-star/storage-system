```html
<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>臨時教室借還核准</title>

  <link
    rel="stylesheet"
    href="/css/temporary.css"
  >
</head>

<body>

  <!-- =========================
       側邊欄
       ========================= -->

  <div class="sidebar">

    <div class="logo">
      🔑 倉儲管理系統
    </div>

    <a
      class="menu"
      href="/schedule.html">
      🏠 系統首頁
    </a>

    <a
      class="menu"
      href="/schedule.html">
      📅 教室課表設置
    </a>

    <a
      class="menu"
      href="#">
      ❄️ 冷氣卡金額管理
    </a>

    <a
      class="menu"
      href="#">
      👤 帳號管理
    </a>

    <a
      class="menu active"
      href="/temporary.html">
      🔑 臨時教室借還核准
    </a>

    <a
      class="menu"
      href="#">
      📡 連線監測
    </a>

    <a
      class="menu"
      href="#">
      📋 網站日誌
    </a>

    <a
      class="menu"
      href="#"
      onclick="logout(); return false;">
      🚪 登出系統
    </a>

  </div>


  <!-- =========================
       主畫面
       ========================= -->

  <div class="main">

    <h1>
      🔑 臨時教室借還核准
    </h1>

    <p id="userInfo">
      載入中...
    </p>


    <!-- =========================
         臨時借用申請
         ========================= -->

    <div class="card">

      <h2>
        📝 臨時教室借用申請
      </h2>

      <div class="form-grid">

        <div>

          <label for="className">
            班級
          </label>

          <input
            id="className"
            type="text"
            placeholder="例如：控制二甲"
          >

        </div>


        <div>

          <label for="classroom">
            教室
          </label>

          <select id="classroom">
          </select>

        </div>


        <div>

          <label for="date">
            日期
          </label>

          <input
            id="date"
            type="date"
          >

        </div>


        <div>

          <label for="startTime">
            開始時間
          </label>

          <input
            id="startTime"
            type="time"
          >

        </div>


        <div>

          <label for="endTime">
            結束時間
          </label>

          <input
            id="endTime"
            type="time"
          >

        </div>


        <div class="full">

          <label for="reason">
            借用原因
          </label>

          <textarea
            id="reason"
            rows="3"
            placeholder="請輸入臨時借用原因"></textarea>

        </div>


        <div class="full">

          <button
            class="btn-primary"
            onclick="submitBooking()">

            📤 送出申請

          </button>

        </div>

      </div>

    </div>


    <!-- =========================
         申請列表
         ========================= -->

    <div class="card">

      <h2>
        📋 臨時借用申請
      </h2>

      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>狀態</th>

              <th>班級</th>

              <th>教室</th>

              <th>日期</th>

              <th>時間</th>

              <th>申請人</th>

              <th>機械手臂格位</th>

              <th>操作</th>

            </tr>

          </thead>

          <tbody id="bookingTable">
          </tbody>

        </table>

      </div>

    </div>


    <!-- =========================
         機械手臂
         ========================= -->

    <div class="card">

      <h2>
        🤖 機械手臂 8 格
      </h2>

      <div
        id="slots"
        class="slots">
      </div>

    </div>

  </div>


  <!-- JavaScript -->

  <script src="/js/temporary.js"></script>

</body>

</html>
```
